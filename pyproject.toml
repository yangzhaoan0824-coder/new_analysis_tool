[project]
name = "dual-engine-analysis"
version = "0.1.0"
description = "双引擎股票分析系统"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
    "platformdirs>=4.0",
    "yfinance>=0.2.31",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["dual_engine*"]
